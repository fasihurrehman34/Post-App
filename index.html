<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase Blog App</title>


    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3959/3959542.png" />


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-blog brand-icon"></i>
            <h1>BlogSphere</h1>
        </div>
        <div class="header-controls">
            <span id="user-display-name" class="hidden"></span>
            <button id="profile-btn" class="hidden"><i class="fa-solid fa-user"></i> Profile</button>
            <button id="theme-toggle-btn"><i class="fa-solid fa-moon"></i> Dark Mode</button>
            <button id="logout-btn" class="hidden btn-delete"><i class="fa-solid fa-right-from-bracket"></i>
                Logout</button>
        </div>
    </header>

    <main class="container">

        <section id="auth-section" class="card">

            <div id="signup-form-container">
                <h2><i class="fa-solid fa-user-plus"></i> Sign Up</h2>
                <form id="signup-form">
                    <div class="form-grid">
                        <input type="text" id="signup-name" placeholder="Full Name" minlength="3" required />
                        <input type="text" id="signup-username" placeholder="Username" minlength="3" required />
                        <input type="text" id="signup-father-name" placeholder="Father's Name" minlength="3" required />
                        <input type="email" id="signup-email" placeholder="Email Address" required />
                        <input type="tel" id="signup-phone" placeholder="Phone Number" minlength="11" maxlength="11"
                            required />
                        <input type="text" id="signup-country" placeholder="Country" required />
                        <input type="text" id="signup-city" placeholder="City" required />
                        <input type="number" id="signup-age" placeholder="Age" min="1" required />
                        <input type="password" id="signup-password" placeholder="Password" required />
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-user-check"></i> Create
                        Account</button>
                </form>
                <button id="google-signup-btn" class="btn-google"><i class="fa-brands fa-google"></i> Sign Up with
                    Google</button>
                <p class="auth-toggle">Already have an account? <a href="#" id="show-login">Login here</a></p>
            </div>


            <div id="login-form-container" class="hidden">
                <h2><i class="fa-solid fa-right-to-bracket"></i> Login</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required />
                    <input type="email" id="login-email" placeholder="Email Address" required />
                    <input type="password" id="login-password" placeholder="Password" required />
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-arrow-right-to-bracket"></i>
                        Login</button>
                </form>
                <button id="google-login-btn" class="btn-google"><i class="fa-brands fa-google"></i> Sign In with
                    Google</button>
                <p class="auth-toggle">Don't have an account? <a href="#" id="show-signup">Sign up here</a></p>
            </div>
        </section>


        <section id="blog-section" class="hidden">
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search posts by title or content..." />
                </div>
                <button id="open-post-modal-btn" class="btn-primary"><i class="fa-solid fa-plus"></i> New Post</button>
            </div>

            <div id="posts-container"></div>
        </section>


        <div id="profile-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-profile-modal" class="close">&times;</span>
                <h2><i class="fa-solid fa-id-card"></i> User Profile</h2>
                <div class="profile-info">
                    <p><strong><i class="fa-solid fa-user"></i> Name:</strong> <span id="profile-name"></span></p>
                    <p><strong><i class="fa-solid fa-at"></i> Username:</strong> <span id="profile-username"></span></p>
                    <p><strong><i class="fa-solid fa-envelope"></i> Email:</strong> <span id="profile-email"></span></p>
                    <p><strong><i class="fa-solid fa-phone"></i> Phone:</strong> <span id="profile-phone"></span></p>
                    <p><strong><i class="fa-solid fa-globe"></i> Location:</strong> <span id="profile-location"></span>
                    </p>
                    <p><strong><i class="fa-solid fa-newspaper"></i> Total Posts:</strong> <span
                            id="profile-post-count">0</span></p>
                </div>
                <hr style="margin: 1rem 0; border: 0; border-top: 1px solid var(--border-color);" />
                <h3>Edit Profile Name</h3>
                <form id="edit-profile-form">
                    <input type="text" id="edit-username" placeholder="New Display Username" required />
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-pen-to-square"></i> Update
                        Username</button>
                </form>
            </div>
        </div>
    </main>


    <div id="post-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2 id="modal-title"><i class="fa-solid fa-pen-nib"></i> Create Post</h2>
            <form id="post-form">
                <input type="hidden" id="post-id" />
                <input type="text" id="post-title" placeholder="Post Title" required />
                <textarea id="post-description" placeholder="Write your post here..." rows="5" maxlength="1500"
                    required></textarea>
                <div id="char-counter" class="char-count">0 / 1500 characters</div>
                <button type="submit" class="btn-primary"><i class="fa-solid fa-paper-plane"></i> Publish Post</button>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
